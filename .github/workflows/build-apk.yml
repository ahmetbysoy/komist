name: Build Android APK

# Tetikleyiciler:
#  - main'e her push
#  - v* etiketli tag'ler (Release'e APK eklenir)
#  - manuel çalıştırma (workflow_dispatch)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # Release oluşturmak için

jobs:
  build-apk:
    name: Derle & APK Üret
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Web uygulamasını derle (Vite)
        run: npm run build

      - name: Capacitor Android projesini ekle
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: APK derle (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK'yı kontrol et
        run: ls -la android/app/build/outputs/apk/debug/

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: bozok-terminal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Sürüm APK'sını kopyala
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/bozok-terminal-${{ github.ref_name }}.apk

      - name: GitHub Release'e APK ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
